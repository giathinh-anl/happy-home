<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Home — Quản lý nhà cho thuê</title>
  <meta name="description" content="Hệ thống quản lý nhà cho thuê Happy Home — bản quản trị">
  <!-- Font: chạy khi có mạng; nếu offline sẽ dùng font hệ thống thay thế -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="app"></div>

  <!-- Nền tảng -->
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <!-- Trang -->
  <script src="js/pages/auth-dashboard.js"></script>
  <script src="js/pages/rooms.js"></script>
  <script src="js/pages/tenants.js"></script>
  <script src="js/pages/contracts.js"></script>
  <script src="js/pages/billing.js"></script>
  <script src="js/pages/misc.js"></script>
  <!-- Điều hướng + khởi động -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Bắt lỗi runtime để không "trắng màn hình" âm thầm
    window.addEventListener('error', function (e) {
      console.error(e.error || e.message);
    });
    document.addEventListener('DOMContentLoaded', function () {
      try { HH.app.boot(); }
      catch (err) {
        document.getElementById('app').innerHTML =
          '<div style="padding:40px;font-family:sans-serif;color:#dc2626">Lỗi khởi động: ' + (err && err.message) + '</div>';
        console.error(err);
      }
    });
  </script>
</body>
</html>
