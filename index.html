<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Home — Quản lý nhà cho thuê</title>
  <meta name="description" content="Hệ thống quản lý nhà cho thuê Happy Home — bản quản trị">
  <!-- Font: chạy khi có mạng; nếu offline sẽ dùng font hệ thống thay thế -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=7">
  <link rel="stylesheet" href="css/base.css?v=7">
  <link rel="stylesheet" href="css/layout.css?v=7">
  <link rel="stylesheet" href="css/components.css?v=7">
  <link rel="stylesheet" href="css/pages.css?v=7">
</head>
<body>
  <div id="app"></div>

  <!-- SDK Supabase (tùy chọn — nếu offline/không có mạng thì app tự chạy chế độ demo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Nền tảng. ?v=N: đổi số này mỗi lần cập nhật để trình duyệt nạp lại (tránh cache cũ) -->
  <script src="js/utils.js?v=7"></script>
  <script>window.HH = window.HH || {};</script>
  <script src="js/config.js?v=7" onerror="console.info('Chưa có js/config.js — chạy chế độ demo')"></script>
  <script src="js/backend.js?v=7"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/components.js?v=7"></script>
  <!-- Trang -->
  <script src="js/pages/auth-dashboard.js?v=7"></script>
  <script src="js/pages/rooms.js?v=7"></script>
  <script src="js/pages/tenants.js?v=7"></script>
  <script src="js/pages/contracts.js?v=7"></script>
  <script src="js/pages/billing.js?v=7"></script>
  <script src="js/pages/misc.js?v=7"></script>
  <script src="js/pages/more.js?v=7"></script>
  <!-- Điều hướng + khởi động -->
  <script src="js/router.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script>
    // Bắt lỗi runtime để không "trắng màn hình" âm thầm
    window.addEventListener('error', function (e) {
      console.error(e.error || e.message);
    });
    document.addEventListener('DOMContentLoaded', function () {
      try { HH.app.boot(); }
      catch (err) {
        document.getElementById('app').innerHTML =
          '<div style="padding:40px;font-family:sans-serif;color:#dc2626">Lỗi khởi động: ' + (err && err.message) + '</div>';
        console.error(err);
      }
    });
  </script>
</body>
</html>
