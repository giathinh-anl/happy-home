<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy Home — Khách thuê</title>
  <meta name="description" content="Ứng dụng khách thuê Happy Home">
  <meta name="theme-color" content="#FDFEFE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#142120" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>try { var th = localStorage.getItem("hh_theme"); if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th); } catch (e) {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Happy Home">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Phông chữ tải song song, KHÔNG chặn vẽ trang: mạng chậm thì hiện ngay bằng phông máy rồi đổi sang phông đẹp khi tải xong -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&text=happyome%20&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <link rel="stylesheet" href="../css/tokens.css?v=40">

</head>
<body>
  <div id="tapp"></div>
  <div class="t-toast-zone" id="ttoast"></div>

  <script>window.HH = window.HH || {};</script>
  <script src="../js/icons.js?v=41"></script>
  <script src="../js/motion.js?v=40"></script>
  <script src="../js/nlu.js?v=40"></script>
  <script src="../js/gemini.js?v=42"></script>
  <script src="../js/split.js?v=40"></script>

  <script src="../js/birthday.js?v=1"></script>

  <script src="../js/progress.js?v=40"></script>
  <script src="js/helpers.js?v=46"></script>
  <script src="js/season-ui.js?v=4"></script>
  <script src="js/tour.js?v=1"></script>
  <script>try { HH.seasonUI.init(); } catch (e) { console.info('Giao diện theo mùa không chạy:', e && e.message); }</script>
  <!-- Cấu hình máy chủ: dùng chung js/config.js của web quản trị (bản trên mạng không có tenant-app/js/config.js riêng, trước đây thẻ đó luôn lỗi 404) -->
  <script src="../js/config.js?v=41" onerror="console.info('Chưa có js/config.js')"></script>
  <!-- Gọi hàm máy chủ: tệp nhỏ cùng chỗ với app, thay thư viện supabase-js (~50 KB) tải từ CDN -->
  <script src="js/rpc-lite.js?v=1"></script>
  <script src="js/tenant.js?v=56"></script>
  <script>
    // PWA: cho phép cài về màn hình chính (chỉ chạy khi mở qua http/https)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.info('SW không đăng ký được:', e && e.message); });
      });
    }
  </script>
</body>
</html>
