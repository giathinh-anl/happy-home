<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 104 90" role="img" aria-label="Happy Home">
  <!-- Happy Home — biểu tượng ngôi nhà mỉm cười (bản phẳng của logo gỗ + xanh) -->
  <defs>
    <linearGradient id="hhWood" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="86">
      <stop offset="0" stop-color="#E4B07A"/>
      <stop offset="1" stop-color="#C98A50"/>
    </linearGradient>
  </defs>
  <!-- thân nhà -->
  <path d="M50.5 6 L4.5 40.5 H10.4 V81 Q10.4 85.3 14.7 85.3 H85.5 Q89.8 85.3 89.8 81 V40.5 H96.6 Z" fill="#0F5C5B"/>
  <!-- ống khói -->
  <path d="M72.2 7.9 H82.1 V17" fill="none" stroke="#0F5C5B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- khung cửa (mảnh xanh nổi) -->
  <path d="M87 47 V82.5 H65.6" fill="none" stroke="#1C7571" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="url(#hhWood)" stroke-linecap="round" stroke-linejoin="round">
    <!-- mái -->
    <path d="M2.8 39.6 L50.5 4.3 L98.2 39.6" stroke-width="6"/>
    <!-- chữ L gỗ -->
    <path d="M13.2 47 V82.5 H54.4" stroke-width="5.4"/>
    <!-- miệng cười -->
    <path d="M35.6 56 Q50.5 70 63.7 56" stroke-width="5"/>
    <!-- chuôi khóa -->
    <path d="M83.2 57 V64.6" stroke-width="1.6"/>
  </g>
  <g fill="url(#hhWood)">
    <circle cx="38.7" cy="44.8" r="4.4"/>
    <circle cx="61.9" cy="44.8" r="4.4"/>
    <circle cx="83.2" cy="55" r="2.5"/>
  </g>
  <circle cx="83.2" cy="55" r="0.95" fill="#0F5C5B"/>
</svg>
